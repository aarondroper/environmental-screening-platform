services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGIS_USER:?set POSTGIS_USER in the shell or an ignored .env file}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?set POSTGIS_PASSWORD in the shell or an ignored .env file}
      POSTGRES_DB: ${POSTGIS_DB:?set POSTGIS_DB in the shell or an ignored .env file}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${ESGP_POSTGIS_DATA_DIR:?set ESGP_POSTGIS_DATA_DIR to a directory outside the repository}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
