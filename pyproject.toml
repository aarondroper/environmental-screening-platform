[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-screening-platform"
version = "0.1.0"
description = "Preliminary geospatial screening and source-provenance workflow"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.3.10,<2",
  "requests>=2.31,<3",
  "shapely>=2.0,<3",
  "pyshp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]
postgis = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
screening = "environmental_screening_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["environmental_screening_platform"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
